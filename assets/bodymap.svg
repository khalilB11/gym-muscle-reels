<!--
  Detailed muscle map — editable source (spec 002, research R5).

  * Design space: 200 x 440 per figure; x = 100 is the body's midline.
  * Draw ONLY the right half of the image (x >= 100). tools/build_bodymap.py mirrors every shape.
  * One <polygon> per muscle region, id = "<view>-<muscle_id>" (add "-2", "-3" for extra pieces).
    Muscle ids must exist in musclereels/data/muscles.yaml. Draw order = document order.
  * Head, neck, hands, joints and feet ("fillers") come from musclereels/bodymap.py.
  * After editing:  python tools/build_bodymap.py   (writes musclereels/data/bodymap/*.json)
-->
