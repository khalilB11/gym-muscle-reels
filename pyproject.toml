[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "musclereels"
version = "0.2.0"
description = "Turn gym clips into Instagram Reels that show which muscles each exercise works"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pillow>=10.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
app = ["PySide6>=6.6", "imageio-ffmpeg>=0.5"]
dev = ["pytest>=7", "pytest-qt>=4", "svgelements>=1.9"]

[project.scripts]
musclereels = "musclereels.cli:main"

[tool.setuptools]
packages = ["musclereels", "musclereels.app"]

[tool.setuptools.package-data]
musclereels = ["data/*.yaml", "data/bodymap/*.json"]
