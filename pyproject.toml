[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "musclereels"
version = "0.1.0"
description = "Turn gym clips into Instagram Reels that show which muscles each exercise works"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pillow>=10.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
musclereels = "musclereels.cli:main"

[tool.setuptools]
packages = ["musclereels"]

[tool.setuptools.package-data]
musclereels = ["data/*.yaml"]
